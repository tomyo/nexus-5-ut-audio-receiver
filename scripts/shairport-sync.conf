// shairport-sync application config for the Nexus 5 AirPlay receiver.
// Installed to /etc/shairport-sync.conf by setup-shairport.sh.
//
// Chain: AirPlay (44.1 kHz ALAC) -> soxr resample -> ALSA "pulse" plugin ->
// PulseAudio sink.primary (48 kHz) -> 3.5 mm jack -> stereo.
//
// Note: shairport-sync 2.8.0 (the Xenial build we can get on armhf) has NO
// native PulseAudio backend - "pulseaudio" is not a valid value for
// output_backend here. ALSA is the only synchronised backend, so we use it
// with ALSA's "pulse" PCM plugin, which needs libasound2-plugins.

general = {
	name = "Parlantes";
	output_backend = "alsa";
	mdns_backend = "avahi";
	interpolation = "soxr";
	port = 5000;
};

alsa = {
	output_device = "pulse";
};
