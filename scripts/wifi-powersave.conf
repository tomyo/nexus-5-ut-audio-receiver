# Managed by setup-shairport.sh - do not edit on device.
#
# Wi-Fi power save makes the radio nap between beacons. On a receiver that must
# be fed at a fixed rate that shows up as receive jitter, which the AirPlay
# bridge can only answer by dropping audio or realigning its timeline - both
# audible. Measured on this device: signal is excellent (-36 dBm) and the link
# shows no packet loss, so the jitter was power save, not the network.
#
# The cost is a few percent of idle battery life. Re-enable with:
#   sudo iw dev wlan0 set power_save on
description "Disable Wi-Fi power save for the AirPlay receiver"
start on (net-device-up IFACE=wlan0)
task
script
  /sbin/iw dev wlan0 set power_save off
end script
