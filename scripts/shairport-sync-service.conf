# Upstart job for the AirPlay receiver.
# Installed to /etc/init/shairport-sync.conf by setup-shairport.sh.
#
# Chain: AirPlay from any iOS/macOS device or Music Assistant -> shairport-sync
# -> ALSA "pulse" plugin -> PulseAudio sink.primary -> 3.5 mm jack -> stereo.
#
# Follows the same lifecycle as the other jobs in this repo: come up with the
# network, go down with the UI session.
description "AirPlay receiver (shairport-sync) -> PulseAudio -> stereo jack"

start on (net-device-up IFACE=wlan0 and started dbus and started avahi-daemon)
stop on stopping unity8

respawn
respawn limit 10 60

# 'started avahi-daemon' only means its init script returned. Avahi's D-Bus
# service can still be missing for several seconds after that, during which
# shairport-sync cannot register and logs "couldn't create avahi client:
# Daemon not running!" once per attempt (29 on one observed boot). It does
# retry and recovers, but until it does the receiver is simply not advertised,
# which looks like a dead device from the phone's AirPlay picker. Wait for
# Avahi to actually answer before starting.
pre-start script
    n=0
    while [ $n -lt 30 ]; do
        avahi-browse -a -t >/dev/null 2>&1 && exit 0
        n=$((n+1))
        sleep 1
    done
    # Give up waiting rather than block forever; shairport-sync's own retry
    # loop is the fallback.
    exit 0
end script

# Runs unprivileged as phablet, which owns the PulseAudio session. Running as
# root fails in a way that looks unrelated: with HOME=/root, libpulse finds no
# cookie, so PulseAudio answers "Access denied" on the ALSA pulse plugin and no
# audio ever leaves the device. sudo -H makes HOME=/home/phablet so the cookie at
# ~/.config/pulse/cookie is found, and PULSE_SERVER removes any reliance on a
# session environment that an Upstart job does not have.
#
# phablet is also allowed to publish through Avahi, verified with an
# avahi-publish test, so the receiver still advertises.
#
# -v goes to /var/log/upstart/shairport-sync.log, which is the first place to
# look when the receiver advertises but no audio flows.
exec sudo -H -u phablet env PULSE_SERVER=unix:/run/user/32011/pulse/native /usr/bin/shairport-sync -v
