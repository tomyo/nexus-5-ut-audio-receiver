description "Bluetooth sender to output volume mapping"
start on started dbus
stop on runlevel [016]
respawn
respawn limit 10 30
pre-start script
    for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > $cpu; done
    chown -R phablet:phablet /run/user/32011/pulse/ || true
end script
exec sudo -u phablet PULSE_RUNTIME_PATH=/run/user/32011/pulse/ python3 /home/phablet/vol_sync.py
