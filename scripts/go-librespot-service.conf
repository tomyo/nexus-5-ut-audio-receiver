description "go-librespot Spotify Connect"

start on (net-device-up IFACE=wlan0 and started dbus)
stop on stopping unity8

respawn
respawn limit 10 5

pre-start script
    mkdir -p /home/phablet/.config/go-librespot
    chown phablet:phablet /home/phablet/.config/go-librespot
end script

exec sudo -u phablet PULSE_RUNTIME_PATH=/run/user/32011/pulse/ /usr/bin/go-librespot --config_dir /home/phablet/.config/go-librespot
